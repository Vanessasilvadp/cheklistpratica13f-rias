<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fechamento de Fim de Ano 2026 · 13º e Férias Coletivas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1B3D;--navy2:#1A2A5E;--indigo:#2B2F8F;--teal:#01516A;
  --terra:#AD4402;--terra2:#C9580F;--beige:#E2DFD0;--beige2:#F4F2EA;
  --black:#161616;--muted:#5E6275;--line:#E4E1D6;--white:#fff;
  --ok:#1F7A4D;--warn:#B7791F;--bad:#B42318;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Montserrat',Arial,sans-serif;background:var(--beige2);color:var(--black);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'DM Serif Display',Georgia,serif;font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
a{color:var(--indigo)}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}

/* SIDEBAR */
.side{background:radial-gradient(420px 320px at 90% 0%,rgba(43,47,143,.9),transparent 65%),linear-gradient(170deg,var(--navy) 0%,var(--navy2) 60%,var(--indigo) 100%);color:#fff;padding:26px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.brand .eyebrow{display:inline-block;background:var(--terra);font-size:11px;font-weight:700;letter-spacing:.12em;padding:4px 10px;border-radius:5px}
.brand h1{font-size:27px;line-height:1.1;margin-top:12px}
.brand p{color:#C7CBE0;font-size:12.5px;margin-top:6px}
.company label{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--beige);display:block;margin-bottom:6px}
.company .row{display:flex;gap:6px}
.company select{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:9px 10px}
.company select option{color:var(--black)}
.icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:9px;width:38px;cursor:pointer;font-size:16px;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.company .mini{display:flex;gap:10px;margin-top:6px}
.company .mini button{background:none;border:0;color:#C7CBE0;font-size:12px;cursor:pointer;text-decoration:underline}
nav{display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;color:#E4E6F2;text-align:left;padding:11px 12px;border-radius:11px;cursor:pointer;font-weight:600;font-size:14.5px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:#fff;color:var(--navy)}
nav .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);flex:none}
nav button.on .ic{background:var(--terra);color:#fff}
nav .ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .pct{margin-left:auto;font-size:11.5px;font-weight:700;opacity:.8}
.side .tools{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.side .tools button,.side .tools label{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:8px 10px;font-size:12.5px;cursor:pointer;text-align:left;font-weight:600}
.side .tools button:hover,.side .tools label:hover{background:rgba(255,255,255,.16)}
.side .credit{font-size:11.5px;color:#C7CBE0;border-top:1px solid rgba(255,255,255,.15);padding-top:14px}
.side .credit a{color:#F0B48A;font-weight:700;text-decoration:none}

/* MAIN */
main{padding:34px 40px 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.head .tag{font-size:11.5px;font-weight:700;letter-spacing:.14em;color:var(--terra)}
.head h2{font-size:36px;color:var(--navy);line-height:1.1;margin-top:4px}
.head p{color:var(--muted);max-width:640px;margin-top:6px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 4px 18px rgba(14,27,61,.06);padding:22px 24px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--terra);color:#fff;border:0;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;letter-spacing:.02em;text-decoration:none;font-size:14px}
.btn:hover{background:var(--terra2)}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--navy2)}
.btn.navy{background:var(--navy2)}
.btn.sm{padding:7px 14px;font-size:13px}
.progress{height:9px;background:var(--beige);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--terra),var(--indigo));border-radius:9px;transition:width .3s}

/* stats */
.stat .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stat .val{font-family:'DM Serif Display',serif;font-size:40px;color:var(--navy);line-height:1.1;margin:6px 0 10px}
.stat a{font-size:13px;font-weight:700;color:var(--terra);cursor:pointer;text-decoration:none}

/* checklist */
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.num{width:34px;height:34px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.sec.done .num{background:var(--ok)}
.sec-h h3{font-size:21px;color:var(--navy);flex:1;line-height:1.2}
.sec-h .count{font-size:12.5px;font-weight:700;color:var(--muted);background:var(--beige2);padding:4px 10px;border-radius:999px}
.sec-h .chev{transition:transform .2s;color:var(--muted)}
.sec.closed .chev{transform:rotate(-90deg)}
.sec.closed .sec-b{display:none}
.sec-b{margin-top:14px}
.item{display:flex;gap:12px;padding:11px 4px;border-top:1px solid var(--beige2);align-items:flex-start}
.item input{appearance:none;width:22px;height:22px;border:2px solid var(--navy2);border-radius:6px;flex:none;cursor:pointer;margin-top:1px;display:grid;place-items:center;background:#fff}
.item input:checked{background:var(--navy2)}
.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.item label{cursor:pointer;flex:1}
.item.ok label{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(94,98,117,.5)}
.item b{color:var(--navy2)}
.item.ok b{color:var(--muted)}
.item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.note-area{width:100%;margin-top:10px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;min-height:46px;resize:vertical;background:var(--beige2)}
.note-area:focus{outline:none;border-color:var(--indigo);background:#fff}
.tip{background:var(--beige2);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:10px}
.tip b{color:var(--terra)}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px}
.f.span2{grid-column:span 2}.f.span3{grid-column:1/-1}
.f label{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.02em}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--indigo)}
.f small{color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:6px;background:#fff;padding:5px;border-radius:999px;box-shadow:0 4px 18px rgba(14,27,61,.06);width:max-content;max-width:100%;overflow:auto;margin-bottom:20px}
.tabs button{border:0;background:none;padding:9px 18px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy2);color:#fff}

/* alerts */
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.res .box{background:var(--beige2);border-radius:12px;padding:14px}
.res .box .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.res .box .v{font-family:'DM Serif Display',serif;font-size:24px;color:var(--navy);margin-top:4px;line-height:1.15}
.res .box .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.al{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;font-size:13.5px}
.al.ok{background:#E7F4EC;color:#14532D}.al.warn{background:#FDF3E1;color:#7A4B07}.al.bad{background:#FDE8E7;color:#7F1D1D}.al.info{background:#ECEEF8;color:var(--navy2)}
.al .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:currentColor}

/* table */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:1180px;font-size:13px;background:#fff}
th{background:var(--navy);color:#fff;font-weight:700;text-align:left;padding:10px 8px;font-size:12px;white-space:nowrap;position:sticky;top:0}
td{padding:6px 6px;border-bottom:1px solid var(--beige2);vertical-align:middle}
td input,td select{width:100%;border:1.5px solid transparent;border-radius:7px;padding:6px 7px;background:var(--beige2)}
td input:focus,td select:focus{outline:none;border-color:var(--indigo);background:#fff}
td.calc{font-weight:700;color:var(--navy2);white-space:nowrap;text-align:right}
td.calc.terra{color:var(--terra)}
tfoot td{font-weight:800;background:var(--beige2);color:var(--navy)}
.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:18px;padding:0 6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--beige2);color:var(--muted)}

/* calendar */
.cal-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-top h3{font-size:28px;color:var(--navy);min-width:220px}
.cal-wrap{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.05em}
.day{background:#fff;border-radius:10px;min-height:104px;padding:6px 6px 8px;cursor:pointer;border:1.5px solid transparent;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day:hover{border-color:var(--indigo)}
.day.out{background:transparent;opacity:.45}
.day.rest{background:#F8F6F0}
.day.today{border-color:var(--terra)}
.day .n{font-weight:800;font-size:13px;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.day .n em{font-style:normal;font-size:9.5px;font-weight:700;color:var(--terra);text-align:right;line-height:1.1;max-width:70%}
.ev{font-size:11px;font-weight:600;line-height:1.25;padding:3px 6px;border-radius:6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);font-weight:700}
.c-13{background:var(--terra)}.c-ferias{background:var(--teal)}.c-guias{background:var(--indigo)}.c-esocial{background:var(--navy2)}.c-feriado{background:#8C8676}.c-nota{background:#7A5AA6}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.legend i{width:10px;height:10px;border-radius:50%}
.agenda .it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--beige2);cursor:pointer}
.agenda .it:last-child{border:0}
.agenda .d{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);min-width:46px;line-height:1}
.agenda .d small{display:block;font-family:'Montserrat';font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.agenda .t{font-size:13.5px;font-weight:600}
.agenda .t span{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.agenda .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(14,27,61,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.modal .card{width:min(520px,100%);max-height:92vh;overflow:auto}
.modal h3{font-size:26px;color:var(--navy);margin-bottom:14px}
.modal .acts{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin-top:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.cta-band{background:radial-gradient(400px 200px at 90% 0%,rgba(43,47,143,.9),transparent 65%),linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--r);padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.cta-band h3{font-size:24px}
.cta-band p{color:#C7CBE0;font-size:13.5px}
.mtop{margin-top:18px}
.muted{color:var(--muted)}
.navlbl{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--beige);margin:12px 12px 2px}
.h3c{font-size:22px;color:var(--navy);margin-bottom:12px}
.exs{display:flex;flex-wrap:wrap;gap:8px}
.exbtn{border:1.5px solid var(--line);background:var(--beige2);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy2)}
.exbtn:hover{border-color:var(--terra);color:var(--terra)}
.lbl2{font-size:12px;font-weight:700;color:var(--navy2);display:block;margin-bottom:8px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.mchip{border:0;border-radius:8px;padding:8px 0;width:64px;font-weight:700;font-size:13px;cursor:pointer;background:var(--beige);color:var(--muted)}
.mchip.on{background:var(--navy2);color:#fff}
.mchip.off{background:#fff;color:var(--bad);border:1.5px dashed var(--bad);text-decoration:line-through}
.crow{display:grid;grid-template-columns:1fr 150px 150px 170px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--beige2)}
.crow:first-of-type{border-top:0}
.crow .cl b{font-size:14.5px;color:var(--navy)}
.crow .cl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.crow .cv{font-weight:800;color:var(--navy2);text-align:right;font-size:15px;white-space:nowrap}
.crow.tot{background:var(--beige2);border-radius:12px;padding:12px 14px;margin-top:6px;border:0}
.crow.tot .cv{color:var(--terra);font-size:18px}
.hid{color:var(--line);letter-spacing:2px}
.seu{border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;text-align:right;width:100%;background:#fff}
.seu:focus{outline:none;border-color:var(--indigo)}
.st{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block}
.st.ok{background:#E7F4EC;color:#14532D}.st.bad{background:#FDE8E7;color:#7F1D1D}
@media (max-width:860px){.crow{grid-template-columns:1fr 1fr}.crow .cl{grid-column:1/-1}.crow .cv{text-align:left}.mchip{width:calc(25% - 5px)}}
.mobile-bar{display:none}

@media (max-width:1100px){.g4{grid-template-columns:1fr 1fr}.res{grid-template-columns:1fr 1fr}.cal-wrap{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-100%);transition:transform .25s;z-index:40}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(14,27,61,.5)}
  .mobile-bar{display:flex;align-items:center;gap:12px;background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30}
  .mobile-bar button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:7px 11px;font-size:18px}
  .mobile-bar b{font-family:'DM Serif Display';font-weight:400;font-size:19px}
  main{padding:22px 16px 50px}
  .head h2{font-size:28px}
  .g2,.g3,.g4,.fgrid,.res{grid-template-columns:1fr}
  .f.span2{grid-column:auto}
  .day{min-height:64px}.ev{font-size:0;height:6px;padding:0}
  .day .n em{display:none}
}
@media print{
  .side,.mobile-bar,.tabs,.btn,.cal-top .btn,.no-print{display:none!important}
  .app{display:block}main{padding:0}
  body{background:#fff}.card{box-shadow:none;border:1px solid var(--line)}
  .sec.closed .sec-b{display:block}
}
</style>
</head>
<body>
<div class="mobile-bar"><button id="menuBtn" aria-label="Abrir menu">☰</button><b>Fechamento 2026</b></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="eyebrow">FIM DE ANO 2026</span>
      <h1>Fechamento do DP: 13º e Férias Coletivas</h1>
      <p>Checklists, planejador de férias e calendário em um só lugar.</p>
    </div>
    <div class="company">
      <label for="companySel">EMPRESA / CLIENTE</label>
      <div class="row"><select id="companySel"></select><button class="icon-btn" id="addCompany" title="Nova empresa">+</button></div>
      <div class="mini"><button id="renCompany">Renomear</button><button id="delCompany">Excluir</button></div>
    </div>
    <nav id="nav">
      <button data-v="painel"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></span>Painel</button>
      <button data-v="13"><span class="ic"><svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg></span>Checklist do 13º<span class="pct" id="pct13"></span></button>
      <button data-v="ferias"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9h18a9 9 0 0 0-9-9z"/><path d="M12 12v8a2 2 0 0 0 4 0"/></svg></span>Férias Coletivas<span class="pct" id="pctFer"></span></button>
      <button data-v="cal"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Calendário</button>
    <div class="navlbl">HORA PRÁTICA</div>
      <button data-v="p13"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M8 19h2M12 19h2M16 15v4"/></svg></span>Prática 13º</button>
      <button data-v="pfer"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M12 11h2M8 15h2M12 15h2M8 19h2M12 19h2M16 11v8"/></svg></span>Prática de férias</button>
    </nav>
    <div class="tools">
      <button id="printBtn">Imprimir esta tela</button>
      <button id="exportBtn">Exportar backup (.json)</button>
      <label>Importar backup<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    </div>
    <div class="credit">Criado por <b>Vanessa Costa Silva</b> · <a href="https://www.instagram.com/vanessasilva.dp/" target="_blank" rel="noopener">@vanessasilva.dp</a><br>Os dados ficam salvos apenas neste navegador.</div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal" id="evModal" role="dialog" aria-modal="true">

/* ================= DATAS / REGRAS ================= */
function userHolidays(){ const out={}; (C().fer.feriadosMun||"").split(/[\s,;]+/).forEach(t=>{const m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(m) out[m[3]+"-"+pad(m[2])+"-"+pad(m[1])]="Feriado informado";}); return out; }
function holidayName(d){ const k=iso(d); return HOLIDAYS[k]||userHolidays()[k]||null; }
function isRest(d,dsr){ return d.getDay()===Number(dsr) || !!holidayName(d); }
function isBank(d){ const w=d.getDay(); return w!==0 && w!==6 && !holidayName(d); }
function prevBank(d){ let x=new Date(d); while(!isBank(x)) x=addDays(x,-1); return x; }
function avos(adm, ref){ // meses de 12 avos entre admissão e ref (inclusive)
  if(!adm||!ref||adm>ref) return 0;
  let n=0, cur=new Date(adm);
  while(true){ const next=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate()); const end=addDays(next,-1);
    if(end<=ref){ n++; cur=next; if(n>=12) break; } else { const rem=Math.round((ref-cur)/864e5)+1; if(rem>=15) n++; break; } }
  return Math.min(n,12);
}

}
function counts(list,state){ let t=0,d=0; list.forEach(s=>s.items.forEach((_,i)=>{t++; if(state[s.id+i]) d++;})); return [d,t]; }
function pct(list,state){ const [d,t]=counts(list,state); return t?Math.round(d/t*100):0; }
function render(){
  updateSide();

}

/* ---------- FÉRIAS ---------- */
function feriasCalc(){
  const f=C().fer, out={alerts:[]};
  const ini=parse(f.inicio), dias=Math.round(num(f.dias));
  if(!ini||!dias) return out;
  const dsr=f.dsr??"0";
  out.ini=ini; out.dias=dias; out.fim=addDays(ini,dias-1); out.ret=addDays(ini,dias);
  out.comLim=addDays(ini,-15); out.comRec=prevBank(out.comLim);
  out.payLim=addDays(ini,-2); out.payRec=prevBank(out.payLim);
  out.s2230i=new Date(ini.getFullYear(),ini.getMonth()+1,15);
  out.s2230f=new Date(out.ret.getFullYear(),out.ret.getMonth()+1,15);
  const A=out.alerts;
  if(dias<10) A.push(["bad","Cada período de férias coletivas precisa ter <b>pelo menos 10 dias corridos</b> (art. 139, §1º)."]);
  if(isRest(ini,dsr)) A.push(["bad",`O início (${br(ini)}) cai em <b>${holidayName(ini)||"dia de repouso (DSR)"}</b>. Escolha outro dia.`]);
  else{ const n1=addDays(ini,1),n2=addDays(ini,2);
    if(isRest(n1,dsr)||isRest(n2,dsr)){ const r=isRest(n1,dsr)?n1:n2; A.push(["bad",`Início vedado: ${br(ini)} está nos 2 dias que antecedem ${holidayName(r)?"o feriado de "+holidayName(r):"o DSR"} (${br(r)}). Art. 134, §3º.`]); }
    else A.push(["ok",`Início em ${br(ini)} (${DOW[ini.getDay()]}) respeita o art. 134, §3º.`]); }
  const hol=[]; for(let i=0;i<dias;i++){const d=addDays(ini,i); const h=holidayName(d); if(h) hol.push(br(d)+" ("+h+")");}
  if(hol.length) A.push(["warn",`Feriados dentro do período: ${hol.join(", ")}. Tratamento escolhido: <b>${esc(f.feriadosTrat||"—")}</b>.`]);
  const today=new Date(); today.setHours(0,0,0,0);
  if(f.porte!=="me") A.push([today>out.comLim && !f.dtMte?"bad":"info",`Comunicar MTE e sindicato até <b>${br(out.comLim)}</b> (${DOW[out.comLim.getDay()]})${+out.comRec!==+out.comLim?` — recomendado enviar até ${br(out.comRec)}`:""}.`]);
  else A.push(["info",`ME/EPP: dispensada do MTE. Comunique o sindicato e afixe o aviso até <b>${br(out.comLim)}</b>.`]);
  if(f.dtMte){ const d=parse(f.dtMte); A.push([d<=out.comLim?"ok":"bad",`Comunicação ao MTE feita em ${br(d)}: ${d<=out.comLim?"dentro":"fora"} do prazo.`]); }
  if(f.dtSind){ const d=parse(f.dtSind); A.push([d<=out.comLim?"ok":"bad",`Envio ao sindicato em ${br(d)}: ${d<=out.comLim?"dentro":"fora"} do prazo.`]); }
  if(f.dtPag){ const d=parse(f.dtPag); A.push([d<=out.payLim?"ok":"bad",`Pagamento previsto em ${br(d)}: ${d<=out.payLim?"dentro":"fora"} do prazo de 2 dias antes (art. 145).`]); }
  else A.push(["info",`Pagar as férias até <b>${br(out.payRec)}</b> (${DOW[out.payRec.getDay()]}).`]);
  return out;
}
function empCalc(e){
  const f=C().fer, ini=parse(f.inicio), dias=Math.round(num(f.dias))||0;
  const ref=ini?addDays(ini,-1):null, adm=parse(e.adm);
  const fx=FALTAS.find(x=>x[0]===e.faltas)||FALTAS[0];
  let av=null, saldo;
  if(e.sit==="afastado"||e.sit==="maternidade"){ return {av:"—",saldo:0,fer:0,lic:0,obs:e.sit==="afastado"?"Fora do comunicado: licença remunerada":"Licença-maternidade: fora das coletivas",rem:0,vf:0,terco:0,vl:0,total:0,licDias:0}; }
  const months = adm&&ref ? (ref.getFullYear()-adm.getFullYear())*12+ref.getMonth()-adm.getMonth()-(ref.getDate()<adm.getDate()?0:0) : 99;
  const lessThan12 = adm&&ref && addDays(new Date(adm.getFullYear()+1,adm.getMonth(),adm.getDate()),-1) > ref;
  if(lessThan12){ av=avos(adm,ref); saldo=av*fx[2]; }
  else saldo = e.saldo!==undefined && e.saldo!=="" ? num(e.saldo) : fx[3];
  const ferD=Math.min(saldo,dias), lic=Math.max(0,dias-ferD);
  const sal=num(e.sal), rem=sal+num(e.med);
  const vf=rem/30*ferD, terco=vf/3, vl=rem/30*lic;
  let obs="";
  if(adm&&ini&&(ini-adm)/864e5<15&&adm<=ini) obs="Menos de 15 dias de casa: licença remunerada no período todo";
  else if(lessThan12) obs=`${av}/12 avos · férias proporcionais; novo período aquisitivo no retorno`;
  else if(saldo>dias) obs=`Restam ${String(saldo-dias).replace(".",",")} dias para gozo individual`;
  return {av:av===null?"12+":av+"/12",saldo,fer:ferD,lic,licDias:lic,rem,vf,terco,vl,total:vf+terco+vl,obs,lessThan12};
}

function viewCal(){
  if(!S.calM){ const t=new Date(); S.calM=t.getFullYear()+"-"+pad(t.getMonth()+1); }
  const [y,m]=S.calM.split("-").map(Number); const first=new Date(y,m-1,1);
  const start=addDays(first,-first.getDay()); const filt=S.calF||{};
  const evs=C().events.filter(e=>!filt[e.cat]);
  const dsr=C().fer.dsr??"0"; const todayK=iso(new Date());
  let cells=DOWS.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<42;i++){ const d=addDays(start,i), k=iso(d), out=d.getMonth()!==m-1; const de=evs.filter(e=>e.date===k);
    if(i>=35 && out && d.getDate()<8 && addDays(start,35).getMonth()!==m-1) break;
    const h=holidayName(d);
    cells+=`<div class="day ${out?"out":""} ${isRest(d,dsr)?"rest":""} ${k===todayK?"today":""}" data-day="${k}"><div class="n">${d.getDate()}${h?`<em>${esc(h)}</em>`:""}</div>${de.slice(0,3).map(e=>`<div class="ev c-${e.cat} ${e.done?"done":""}" data-ev="${e.id}" title="${esc(e.title)}">${esc(e.title)}</div>`).join("")}${de.length>3?`<div class="more">+${de.length-3}</div>`:""}</div>`; }
  const monthEv=evs.filter(e=>e.date.startsWith(S.calM)).sort((a,b)=>a.date.localeCompare(b.date));

/* ================= HORA PRÁTICA ================= */
const r2 = x => Math.round(Number((x*100).toPrecision(12)))/100;
const fmt = v => (v===null||v===undefined||!isFinite(v)) ? "—" : v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const INSS_T = [[1621.00,0.075,0],[2902.84,0.09,24.32],[4354.27,0.12,111.40],[8475.55,0.14,198.49]];
const IR_T = [[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[Infinity,0.275,908.73]];
const DEP=189.59, SIMPL=607.20, TETO=8475.55;
function inssCalc(b){
  if(b<=0) return {v:0,txt:"Sem base"};
  const base=Math.min(b,TETO); const f=INSS_T.find(x=>base<=x[0]);
  const v=r2(base*f[1]-f[2]);
  return {v, txt:`${fmt(base)} × ${String(f[1]*100).replace(".",",")}% − ${fmt(f[2])}${b>TETO?" (limitado ao teto)":""}`};
}
function irrfCalc(bruto,inss,dep){
  if(bruto<=0) return {v:0,ded:0,base:0,tab:0,red:0,usa:"—"};
  const legal=r2(inss+dep*DEP), usaS=SIMPL>legal, ded=usaS?SIMPL:legal;
  const base=Math.max(0,r2(bruto-ded)); const f=IR_T.find(x=>base<=x[0]);
  const tab=Math.max(0,r2(base*f[1]-f[2]));
  let red=0, redTxt="";
  if(bruto<=5000){ red=Math.min(tab,312.89); redTxt="Bruto até R$ 5.000: redução até R$ 312,89"; }
  else if(bruto<=7350){ red=Math.min(tab,Math.max(0,r2(978.62-0.133145*bruto))); redTxt=`978,62 − (0,133145 × ${fmt(bruto)})`; }
  else redTxt="Bruto acima de R$ 7.350: sem redução";
  return {v:r2(tab-red),ded,base,tab,red,usa:usaS?"Desconto simplificado (607,20)":`INSS${dep?" + "+dep+" dependente(s)":""}`,aliq:f[1],parc:f[2],redTxt};
}
function parseBR(s){ s=String(s).trim().replace(/^R\$\s*/,""); if(s.includes(",")) s=s.replace(/\./g,"").replace(",","."); const n=parseFloat(s); return isFinite(n)?n:0; }
function pState(k,def){ const c=C(); c[k]=c[k]||JSON.parse(JSON.stringify(def)); return c[k]; }

function monthsActive(p){
  const adm=parse(p.adm), desl=parse(p.desl); const act=[];
  for(let m=0;m<12;m++){
    const ini=new Date(2026,m,1), fim=new Date(2026,m+1,0);
    const a=adm&&adm>ini?adm:ini, b=desl&&desl<fim?desl:fim;
    const dias=b>=a?Math.round((b-a)/864e5)+1:0;
    act.push(dias>=15 && !(p.off||[]).includes(m));
  }
  return act;
}
function calc13(p){
  const sal=num(p.sal), dep=Math.max(0,Math.round(num(p.dep))); const act=monthsActive(p); const avos=act.filter(Boolean).length;
  let m=[0,0,0], mtxt=["","",""];
  if(p.modo==="pronta"){ m=[num(p.m1),num(p.m2),num(p.m3)]; mtxt=["média informada","média informada","média informada"]; }
  else if(p.modo==="mensal"){
    [10,11,12].forEach((k,i)=>{ let sv=0,sd=0,n=0; for(let j=0;j<k;j++) if(act[j]){ sv+=num(p.var[j]); sd+=num(p.dsr[j]); n++; }
      const mv=n?r2(sv/n):0, md=n?r2(sd/n):0; m[i]=r2(mv+md); mtxt[i]=n?`variáveis ${fmt(sv)} ÷ ${n} = ${fmt(mv)} · DSR ${fmt(sd)} ÷ ${n} = ${fmt(md)}`:"sem meses no período"; });
  }
  const R={avos,act,m,mtxt};
  R.int1=r2((sal+m[0])/12*avos); R.p1=r2(R.int1/2);
  R.p1pago=p.p1pago!==""&&p.p1pago!==undefined?num(p.p1pago):R.p1;
  R.int2=r2((sal+m[1])/12*avos); R.inss2=inssCalc(R.int2); R.ir2=irrfCalc(R.int2,R.inss2.v,dep);
  R.liq2=r2(R.int2-R.p1pago-R.inss2.v-R.ir2.v);
  R.temVar=p.modo!=="nenhum";
  if(R.temVar){ R.int3=r2((sal+m[2])/12*avos); R.dif=r2(R.int3-R.int2); const i3=inssCalc(R.int3), ir3=irrfCalc(R.int3,i3.v,dep);
    R.inss3=r2(i3.v-R.inss2.v); R.ir3=r2(ir3.v-R.ir2.v); R.liq3=r2(R.dif-R.inss3-R.ir3); }
  return R;
}
function rowCk(key,label,formula,val,p,opts={}){
  const seu=p.seu[key]; const has=seu!==undefined&&seu!=="";

}

  </div>`:""}
  ${p.desafio?`<div class="al info mtop"><span class="dot"></span><span>Modo desafio ativo: as respostas estão escondidas, mas a conferência dos seus valores continua funcionando. Desmarque o modo desafio para ver a memória de cálculo.</span></div>`:""}
  <div class="tip mtop"><b>Regras usadas:</b> salário mínimo R$ 1.621,00 · INSS 2026 progressivo (teto R$ 8.475,55) · IRRF com o mais vantajoso entre o desconto simplificado (R$ 607,20) e INSS + dependentes (R$ 189,59) · redutor da Lei 15.270/2025 sobre o bruto do 13º. Pensão alimentícia e outras particularidades não entram no cálculo.</div>`;
}

/* ---------- FÉRIAS ---------- */
const PF_DEF={tipo:"coletivas",sal:"",med:"",inicio:"2026-12-21",dias:14,direito:"adquirido",faltas:"0-5",saldo:"",adm:"",abono:0,dep:0,com:Array(12).fill(""),cdsr:Array(12).fill(""),showCom:false,desafio:false,seu:{}};
const PF_EX={
  joao:["João · R$ 2.300 · 30 dias adquiridos · 14 dias de coletivas",{sal:"2300",direito:"adquirido",faltas:"0-5",dias:14,inicio:"2026-12-21"}],
  maria:["Maria · R$ 3.500 · admitida em 01/09/2026 · 14 dias",{sal:"3500",direito:"proporcional",adm:"2026-09-01",faltas:"0-5",dias:14,inicio:"2026-12-21"}],
  com:["Comissionista · R$ 3.800 + comissões · 14 dias",{sal:"3800",direito:"adquirido",dias:14,inicio:"2026-12-21",showCom:true,com:["350","650","500","580","700","900","1050","1600","850","350","750","340"],cdsr:["70","130","100","116","140","180","210","320","170","70","150","68"]}],
  ind:["Férias individuais · R$ 4.200 · 20 dias + 10 de abono",{tipo:"individuais",sal:"4200",direito:"adquirido",dias:20,abono:10,inicio:"2027-01-11"}]
};
function comMedia(p){ let sc=0,sd=0,n=0; for(let i=0;i<12;i++){ if(p.com[i]!==""||p.cdsr[i]!==""){ sc+=num(p.com[i]); sd+=num(p.cdsr[i]); n++; } } const mc=n?r2(sc/n):0, md=n?r2(sd/n):0; return {mc,md,n,tot:r2(mc+md),sc,sd}; }
function calcF(p){
  const sal=num(p.sal), dep=Math.max(0,Math.round(num(p.dep)));
  const cm=comMedia(p); const med=p.showCom&&cm.n?cm.tot:num(p.med);
  const rem=r2(sal+med); const ini=parse(p.inicio); const dias=Math.max(0,Math.round(num(p.dias)));
  const fx=FALTAS.find(x=>x[0]===p.faltas)||FALTAS[0];
  let direito, av=null, dtxt;
  if(p.direito==="proporcional"){ const adm=parse(p.adm); av=adm&&ini?avos(adm,addDays(ini,-1)):0; direito=av*fx[2]; dtxt=`${av}/12 avos × ${String(fx[2]).replace(".",",")} dias`; }
  else if(p.saldo!==""&&p.saldo!==undefined){ direito=num(p.saldo); dtxt="saldo informado"; }
  else { direito=fx[3]; dtxt=`${fx[1].toLowerCase()} no período aquisitivo`; }
  const R={rem,med,cm,direito,av,dtxt,dias};
  if(p.tipo==="coletivas"){ R.fer=Math.min(direito,dias); R.lic=Math.max(0,dias-R.fer); R.abono=0; }
  else { R.abono=Math.min(num(p.abono),Math.floor(direito/3)); R.fer=Math.min(dias,direito-R.abono); R.lic=0; }
  R.vf=r2(rem/30*R.fer); R.terco=r2(R.vf/3); R.bruto=r2(R.vf+R.terco);
  R.inss=inssCalc(R.bruto); R.ir=irrfCalc(R.bruto,R.inss.v,dep);
  R.liq=r2(R.bruto-R.inss.v-R.ir.v);
  R.vab=r2(rem/30*R.abono); R.tab=r2(R.vab/3);
  R.vl=r2(rem/30*R.lic);
  R.fgts=r2((R.bruto+R.vl)*0.08);
  if(ini){ R.fim=addDays(ini,R.fer+R.lic-1); R.ret=addDays(ini,R.fer+R.lic); R.pag=prevBank(addDays(ini,-2)); }
  return R;
}
function viewPF(){
  const p=pState("pfer",PF_DEF); const R=calcF(p);
  const exBtns=Object.entries(PF_EX).map(([k,v])=>`<button class="exbtn" data-exf="${k}">${v[0]}</button>`).join("");
  const comTbl=p.showCom?`<div class="tbl-wrap mtop"><table style="min-width:520px"><thead><tr><th>Mês (12 meses antes da concessão)</th><th>Comissão</th><th>DSR</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{const ini=parse(p.inicio)||new Date(2026,11,1); const d=new Date(ini.getFullYear(),ini.getMonth()-12+i,1); return `<tr><td><b>${MONTHS[d.getMonth()].slice(0,3).toLowerCase()}/${d.getFullYear()}</b></td><td><input type="number" step="0.01" data-pcom="${i}" value="${esc(p.com[i])}" placeholder="0,00"></td><td><input type="number" step="0.01" data-pcdsr="${i}" value="${esc(p.cdsr[i])}" placeholder="0,00"></td></tr>`;}).join("")}</tbody>
   <tfoot><tr><td>Média (${R.cm.n} meses)</td><td class="calc">${fmt(R.cm.mc)}</td><td class="calc">${fmt(R.cm.md)}</td></tr></tfoot></table></div><small class="muted">Art. 142, §3º: comissões pela média dos 12 meses que antecedem a concessão. Média total usada: <b>R$ ${fmt(R.cm.tot)}</b>.</small>`:"";
  return head("HORA PRÁTICA · FÉRIAS","Prática de férias: calcule e confira","Monte o cálculo de férias coletivas ou individuais, com proporcionais, médias, licença remunerada e abono, e confira os seus valores.",`<label class="chk no-print" style="margin:0"><input type="checkbox" id="desF" ${p.desafio?"checked":""}> Modo desafio (esconder respostas)</label>`)+
  `<div class="card no-print"><h3 class="serif h3c">Exemplos da imersão</h3><div class="exs">${exBtns}</div><button class="btn ghost sm mtop" data-clear="pfer">Limpar e começar do zero</button></div>
  <div class="card mtop"><h3 class="serif h3c">Dados das férias</h3>
   <div class="fgrid">
    ${psel("pfer","tipo","Tipo de férias",[["coletivas","Férias coletivas"],["individuais","Férias individuais"]],p)}
    ${pf("pfer","inicio","Data de início",p,"date")}${pf("pfer","dias",p.tipo==="coletivas"?"Dias corridos das coletivas":"Dias de gozo",p,"number")}
    ${pf("pfer","sal","Salário na data da concessão (R$)",p,"number")}
    ${p.showCom?`<div class="f"><label>Médias de variáveis (R$)</label><input value="${fmt(R.cm.tot)} (tabela de comissões)" disabled></div>`:pf("pfer","med","Médias de variáveis (R$)",p,"number","HE, adicional noturno, comissões...")}
    <div class="f"><label>Comissões mês a mês</label><button class="btn ghost sm" id="togCom" style="justify-content:center">${p.showCom?"Usar média pronta":"Calcular média de comissões"}</button></div>
    ${psel("pfer","direito","Direito a férias",[["adquirido","Período aquisitivo completo"],["proporcional","Menos de 12 meses (proporcional)"]],p)}
    ${p.direito==="proporcional"?pf("pfer","adm","Data de admissão",p,"date"):pf("pfer","saldo","Saldo de dias (opcional)",p,"number","Vazio: usa a faixa de faltas")}
    ${psel("pfer","faltas","Faltas injustificadas no período",FALTAS.map(f=>[f[0],f[1]]),p)}
    ${p.tipo==="individuais"?pf("pfer","abono","Dias de abono pecuniário",p,"number","Até 1/3 do direito (art. 143)"):""}
    ${pf("pfer","dep","Dependentes para IRRF",p,"number")}
   </div>${comTbl}</div>
  <div class="card mtop"><h3 class="serif h3c">Dias</h3>
    ${rowCk("dir","Dias de direito",R.dtxt,R.direito,p,{raw:String(R.direito).replace(".",",")+" dias"})}
    ${rowCk("fer","Dias de férias pagos",p.tipo==="coletivas"?"menor valor entre o direito e os dias das coletivas":"dias de gozo",R.fer,p,{raw:String(R.fer).replace(".",",")+" dias"})}
    ${p.tipo==="coletivas"?rowCk("licd","Dias de licença remunerada","dias das coletivas − dias de férias",R.lic,p,{raw:String(R.lic).replace(".",",")+" dias"}):rowCk("abd","Dias de abono","",R.abono,p,{raw:R.abono+" dias"})}
    ${R.pag?`<div class="crow"><div class="cl"><b>Período e pagamento</b><small>Art. 145: até 2 dias antes do início</small></div><div class="cv" style="grid-column:span 3;text-align:left">${br(parse(p.inicio))} a ${br(R.fim)} · retorno ${br(R.ret)} · pagar até <b>${br(R.pag)}</b></div></div>`:""}
  </div>
  <div class="card mtop"><h3 class="serif h3c">Valores</h3>
    ${rowCk("rem","Remuneração base","salário "+fmt(num(p.sal))+" + médias "+fmt(R.med),R.rem,p)}
    ${rowCk("vf","Férias",fmt(R.rem)+" ÷ 30 × "+String(R.fer).replace(".",","),R.vf,p)}
    ${rowCk("terco","(+) 1/3 constitucional","férias ÷ 3",R.terco,p)}
    ${rowCk("bruto","Bruto de férias","férias + 1/3",R.bruto,p)}
    ${rowCk("inss","(−) INSS",R.inss.txt,R.inss.v,p)}
    ${rowCk("irb","Base do IRRF",fmt(R.bruto)+" − "+fmt(R.ir.ded)+" ("+R.ir.usa+")",R.ir.base,p)}
    ${rowCk("irt","IRRF pela tabela","",R.ir.tab,p)}
    ${rowCk("ired","(−) Redutor Lei 15.270/2025",R.ir.redTxt,R.ir.red,p)}
    ${rowCk("ir","(−) IRRF devido","",R.ir.v,p)}
    ${rowCk("liq","Líquido de férias","bruto − INSS − IRRF",R.liq,p,{total:true})}
    ${R.abono?rowCk("vab","(+) Abono pecuniário (sem INSS/IRRF)",fmt(R.rem)+" ÷ 30 × "+R.abono+" + 1/3 ("+fmt(R.tab)+")",r2(R.vab+R.tab),p):""}
    ${R.lic?rowCk("vl","Licença remunerada (folha do mês)",fmt(R.rem)+" ÷ 30 × "+String(R.lic).replace(".",","),R.vl,p):""}
    ${rowCk("fgts","FGTS (8%) informativo","(bruto de férias + licença) × 8%",R.fgts,p,{noCheck:true})}
  </div>
  ${p.desafio?`<div class="al info mtop"><span class="dot"></span><span>Modo desafio ativo: as respostas estão escondidas, mas a conferência dos seus valores continua funcionando.</span></div>`:""}
  <div class="tip mtop"><b>Para lembrar:</b> o INSS aqui é calculado só sobre as férias, como nos exemplos da imersão. Na folha, ele incide sobre o total da competência (férias + saldo de salário + licença). A licença remunerada também tem INSS, IRRF e FGTS e é paga na folha do mês. O abono pecuniário e o 1/3 sobre ele não têm INSS nem IRRF.</div>`;
}

/* ---------- campos e eventos ---------- */
function pf(obj,k,label,src,type="text",help=""){
  return `<div class="f"><label for="${obj}-${k}">${label}</label><input id="${obj}-${k}" type="${type}" ${type==="number"?'step="0.01"':""} data-pp="${obj}" data-k="${k}" value="${esc(src[k]??"")}">${help?`<small>${help}</small>`:""}</div>`;
}
function psel(obj,k,label,opts,src){
  return `<div class="f"><label for="${obj}-${k}">${label}</label><select id="${obj}-${k}" data-pp="${obj}" data-k="${k}">${opts.map(o=>`<option value="${o[0]}" ${String(src[k])===String(o[0])?"selected":""}>${o[1]}</option>`).join("")}</select></div>`;
}
function rerender(){ const y=window.scrollY; render(); window.scrollTo(0,y); }
function bindPratica(){
  const m=$("#main"); const c=C();
  m.querySelectorAll("[data-pp]").forEach(i=>i.addEventListener("change",()=>{ c[i.dataset.pp][i.dataset.k]=i.value; save(); rerender(); }));
  m.querySelectorAll("[data-seu]").forEach(i=>i.addEventListener("change",()=>{ const o=S.view==="p13"?c.p13:c.pfer; o.seu[i.dataset.seu]=i.value.trim(); save(); rerender(); }));
  m.querySelectorAll("[data-pvar]").forEach(i=>i.addEventListener("change",()=>{ c.p13.var[i.dataset.pvar]=i.value; save(); rerender(); }));
  m.querySelectorAll("[data-pdsr]").forEach(i=>i.addEventListener("change",()=>{ c.p13.dsr[i.dataset.pdsr]=i.value; save(); rerender(); }));
  m.querySelectorAll("[data-pcom]").forEach(i=>i.addEventListener("change",()=>{ c.pfer.com[i.dataset.pcom]=i.value; save(); rerender(); }));
  m.querySelectorAll("[data-pcdsr]").forEach(i=>i.addEventListener("change",()=>{ c.pfer.cdsr[i.dataset.pcdsr]=i.value; save(); rerender(); }));
  m.querySelectorAll("[data-moff]").forEach(b=>b.onclick=()=>{ const i=Number(b.dataset.moff); const o=c.p13.off||(c.p13.off=[]); const k=o.indexOf(i); if(k>=0) o.splice(k,1); else o.push(i); save(); rerender(); });
  m.querySelectorAll("[data-ex13]").forEach(b=>b.onclick=()=>{ c.p13=Object.assign(JSON.parse(JSON.stringify(P13_DEF)),JSON.parse(JSON.stringify(P13_EX[b.dataset.ex13][1])),{desafio:c.p13.desafio}); save(); rerender(); toast("Exemplo carregado"); });
  m.querySelectorAll("[data-exf]").forEach(b=>b.onclick=()=>{ c.pfer=Object.assign(JSON.parse(JSON.stringify(PF_DEF)),JSON.parse(JSON.stringify(PF_EX[b.dataset.exf][1])),{desafio:c.pfer.desafio}); save(); rerender(); toast("Exemplo carregado"); });
  m.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>{ const k=b.dataset.clear; c[k]=JSON.parse(JSON.stringify(k==="p13"?P13_DEF:PF_DEF)); save(); rerender(); });
  const d1=$("#des13"); if(d1) d1.onchange=()=>{ c.p13.desafio=d1.checked; save(); rerender(); };
  const d2=$("#desF"); if(d2) d2.onchange=()=>{ c.pfer.desafio=d2.checked; save(); rerender(); };
  const tc=$("#togCom"); if(tc) tc.onclick=()=>{ c.pfer.showCom=!c.pfer.showCom; save(); rerender(); };
}

load(); render();
</script>
